<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L5 Lamp — Parametric Viewer</title>
  <style>
    :root {
      --bg: #0b0b0d;
      --fg: #e8e6e1;
      --accent: #f0c060;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans JP", sans-serif;
      overflow: hidden;
    }
    #app { position: fixed; inset: 0; }
    #hud {
      position: fixed;
      top: 12px; left: 12px;
      font-size: 12px;
      line-height: 1.5;
      pointer-events: none;
      opacity: 0.85;
      max-width: 360px;
    }
    #hud h1 {
      margin: 0 0 4px 0;
      font-size: 14px;
      letter-spacing: 0.06em;
      color: var(--accent);
    }
    #hud code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: rgba(255,255,255,0.06);
      padding: 0 4px; border-radius: 3px;
    }
    #toast {
      position: fixed;
      bottom: 16px; left: 50%;
      transform: translateX(-50%);
      padding: 8px 14px;
      border-radius: 6px;
      background: rgba(0,0,0,0.7);
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
    #toast.show { opacity: 1; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.2/dist/lil-gui.esm.js"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <h1>L5 LAMP — PARAMETRIC VIEWER</h1>
    <div>PH2/1 inspired · 3 log-spiral shades · sin-wave modulated · L5 triangular mount</div>
    <div style="margin-top:6px; opacity:0.7">
      drag: rotate · wheel: zoom · right-drag: pan<br/>
      sliders top-right · <code>L</code>: toggle light · <code>W</code>: wireframe
    </div>
  </div>
  <div id="toast"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
